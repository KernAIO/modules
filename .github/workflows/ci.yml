name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
permissions: { contents: read, packages: read }
jobs:
  changeset:
    # A published package that moves without a changeset is the quietest failure here: the push is
    # green, `changeset version` finds nothing to bump, `changeset publish` has nothing new to send,
    # and the fix simply never leaves this repository. Nothing downstream notices, because from the
    # outside nothing happened. Fail at the commit that caused it instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A change under packages/ needs a changeset
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # The first push to a branch reports an all-zero `before`, and a release commit rewrites
          # history — in both cases there is no useful range, so there is nothing to judge.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit — skipping."; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if ! echo "$CHANGED" | grep -q '^packages/'; then
            echo "Nothing under packages/ changed."; exit 0
          fi
          # `changeset version` consumes these files, so a release commit legitimately removes them.
          # Only their presence in this range matters.
          if echo "$CHANGED" | grep -qE '^\.changeset/.*\.md$'; then
            echo "Changeset present."; exit 0
          fi
          # Formatting, comments and test-only edits do change a published file without changing
          # what it does. Saying so in the commit message is the opt-out — deliberate, and visible
          # in the history, which a disabled check would not be.
          if git log --format=%B "$BASE..${{ github.sha }}" | grep -qF '[no changeset]'; then
            echo "Opted out with [no changeset]."; exit 0
          fi
          echo "::error::This changes packages/ but adds no changeset, so nothing will publish. Run 'pnpm changeset' and commit the file, or add one under .changeset/ saying which package moved and how far."
          exit 1

  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://kern:kern@127.0.0.1:5432/kern
    services:
      # The suites run against a real Postgres: they create a scratch database per file, apply the
      # migrations and prove row-level security by connecting as an unprivileged role. Nothing here
      # is mocked, so without this service the whole suite fails to start rather than quietly
      # passing.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: kern
          POSTGRES_PASSWORD: kern
          POSTGRES_DB: kern
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kern"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # a module publishes its client as source; make sure the tarball can actually resolve it
      - run: pnpm check:pack
      # a module's manifest version has to match the package it ships in, or every admin is told
      # the wrong version of the thing they are running
      - run: pnpm check:versions
